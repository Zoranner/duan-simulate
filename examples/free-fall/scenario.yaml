scenario:
  id: free_fall_demo
  package: examples.free-fall

packages:
  - id: duan.kinematics
    version: 0.1.0
  - id: examples.free-fall.components
    version: 0.1.0
  - id: examples.free-fall.domains
    version: 0.1.0
  - id: examples.free-fall.entities
    version: 0.1.0

domains:
  - type: examples.free-fall.domains.motion
    factory: earth

entities:
  - id: ground
    type: examples.free-fall.entities.ground
    components:
      duan.kinematics.position-2: { x: 0.0, y: 0.0 }
      examples.free-fall.components.static-body: {}
      examples.free-fall.components.collider: { restitution: 0.8 }

  - id: ball
    type: examples.free-fall.entities.ball
    components:
      duan.kinematics.position-2: { x: 0.0, y: 10.0 }
      duan.kinematics.velocity-2: { vx: 0.0, vy: 0.0 }

run:
  delta_time: 0.01
  max_time: 20.0

outputs:
  frames: runs/free_fall/frames.jsonl
  events: runs/free_fall/events.jsonl
  metrics: runs/free_fall/metrics.json
